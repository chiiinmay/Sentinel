<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raksha AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <div class="logo">
        <span class="logo-icon">🛡️</span>
        <span class="logo-text">Raksha AI</span>
      </div>
      <span class="version">v1.0</span>
    </div>
    <div class="gauge-section">
      <div class="gauge-wrapper">
        <svg viewBox="0 0 120 120" class="gauge-svg">
          <circle class="gauge-bg" cx="60" cy="60" r="52" />
          <circle class="gauge-fill" id="gaugeFill" cx="60" cy="60" r="52" />
        </svg>
        <div class="gauge-label">
          <span class="gauge-value" id="gaugeValue">--</span>
          <span class="gauge-unit">trust</span>
        </div>
      </div>
    </div>
    <div class="status-card" id="statusCard">
      <div class="status-indicator" id="statusDot"></div>
      <div class="status-text">
        <span class="status-title" id="statusTitle">Initializing…</span>
        <span class="status-sub" id="statusSub">Loading</span>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat">
        <span class="stat-value" id="linksScanned">0</span>
        <span class="stat-label">Links Scanned</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="threatsBlocked">0</span>
        <span class="stat-label">Threats Blocked</span>
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="dashboardBtn">Open Dashboard</button>
      <button class="btn btn-secondary" id="enrollBtn">Re-Enroll</button>
    </div>
    <div class="privacy-section">
      <div class="privacy-title">Privacy Dashboard</div>
      <div class="privacy-item">
        <span class="privacy-check">&#10004;</span>
        <span>No keystrokes stored</span>
      </div>
      <div class="privacy-item">
        <span class="privacy-check">&#10004;</span>
        <span>No data sent to server</span>
      </div>
      <div class="privacy-item">
        <span class="privacy-check">&#10004;</span>
        <span>Everything processed locally</span>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
